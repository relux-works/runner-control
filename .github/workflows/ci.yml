name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select Xcode 26 toolchain and show versions
        run: |
          ls /Applications | grep -i Xcode || true
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcode-select -p
          xcodebuild -version
          swift --version
      - name: Core unit tests (no UI tests or production runners)
        run: ./Scripts/run-bounded-swift-tests.sh --timeout-secs 600 --package-path Packages/RunnerControlCore --scratch-path "$RUNNER_TEMP/runner-control-tests"
      - name: Release metadata tests
        run: python3 -m unittest discover -s Scripts/tests -v
